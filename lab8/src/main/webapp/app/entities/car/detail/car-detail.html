<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (car(); as carRef) {
      <div>
        <h2 data-cy="carDetailsHeading"><span jhiTranslate="lab8App.car.detail.title">Car</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ carRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="lab8App.car.brand">Brand</span></dt>
          <dd>
            <span>{{ carRef.brand }}</span>
          </dd>
          <dt><span jhiTranslate="lab8App.car.model">Model</span></dt>
          <dd>
            <span>{{ carRef.model }}</span>
          </dd>
          <dt><span jhiTranslate="lab8App.car.pricePerHour">Price Per Hour</span></dt>
          <dd>
            <span>{{ carRef.pricePerHour }}</span>
          </dd>
          <dt><span jhiTranslate="lab8App.car.rentalOffice">Rental Office</span></dt>
          <dd>
            @if (car()!.rentalOffice) {
              <div>
                <a [routerLink]="['/rental-office', car()!.rentalOffice?.id, 'view']">{{ carRef.rentalOffice?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/car', carRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
